<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1826"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Roof Capture Guide</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf2f8;background:#0a1826}*{box-sizing:border-box}body{margin:0}.app{max-width:750px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px max(24px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 15px;border-bottom:1px solid #274053}.brand{font-weight:800;letter-spacing:.07em;color:#73d8d0}.count{font-size:14px;color:#a9beca}.track{height:5px;background:#29404f;border-radius:20px;margin:20px 0}.fill{height:100%;background:#5ad5bd;border-radius:20px;transition:width .3s}h1{font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.05;margin:14px 0}p{color:#b8cbd6;line-height:1.5}.eyebrow{color:#71d9c5;text-transform:uppercase;font-size:13px;font-weight:800;letter-spacing:.11em}.card{background:#122a3a;border:1px solid #315064;border-radius:20px;padding:20px;margin:19px 0}.guide{background:#183746;border-left:4px solid #58d6c0;border-radius:10px;padding:15px;margin:17px 0;color:#dceaf0}.guide strong{display:block;margin-bottom:5px}.guide span{line-height:1.45}.shot{width:100%;aspect-ratio:4/3;border:2px dashed #5d8393;border-radius:17px;display:grid;place-content:center;text-align:center;overflow:hidden;background:#0b202e;color:#9cbbc6;margin:18px 0}.shot img{width:100%;height:100%;object-fit:contain}.shot svg{margin:auto auto 8px}.shot span{font-size:14px}label{display:block;font-weight:700;margin:15px 0 7px}input[type=text],input[type=number],select{width:100%;font:inherit;color:#fff;background:#0b202e;border:1px solid #648092;border-radius:12px;padding:13px;min-height:48px}input:focus,select:focus,button:focus-visible{outline:3px solid #79e2d0;outline-offset:2px}.capture{position:relative;overflow:hidden}.capture input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}button,.capture{font:inherit;border:0;border-radius:12px;padding:15px 18px;font-weight:800;min-height:52px;cursor:pointer}button.primary,.capture{display:block;width:100%;text-align:center;background:#5ad5bd;color:#09212a}button.secondary{background:#203c4d;color:#e4f2f6}button:disabled{background:#415460;color:#a8b7bf;cursor:not-allowed}.row{display:flex;gap:10px;margin-top:20px}.row button{flex:1}.checks label{display:flex;align-items:flex-start;gap:11px;font-weight:500;line-height:1.4;background:#0c2331;border:1px solid #315064;border-radius:12px;padding:12px;margin:9px 0}.checks input{width:21px;height:21px;accent-color:#5ad5bd;flex:none;margin:1px 0}.notice{color:#ffd189;font-size:14px}.error{color:#ffb1a8;font-weight:650}.success{color:#81e3cf}.small{font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid div{background:#0b2230;border-radius:9px;padding:9px}.finished{list-style:none;padding:0}.finished li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #315064}.finished img{width:70px;height:55px;object-fit:cover;border-radius:7px}.foot{font-size:13px;color:#8eabb9;margin-top:22px}</style></head><body><main class="app"><header><div class="brand">ROOF / CAPTURE</div><div class="count" id="count"></div></header><div class="track"><div class="fill" id="fill"></div></div><section id="screen"></section></main><script>
const steps=[
{id:'setup',title:'Set the job up',kind:'setup',lead:'Start with the address and a reference size you can actually verify.',tip:'Use a rigid measuring stick or a laser-measured wall span. A loose object in the yard cannot scale the roof plane.'},
{id:'front',title:'Front overview',kind:'photo',lead:'Stand far enough back to fit the entire front roof and both corners in frame.',tip:'Hold the iPhone level at about chest height. Use 1×, keep the whole roof visible, and avoid digital zoom.',checks:['Both front corners and the ridge or upper roofline are visible','Image is sharp and no tree or vehicle blocks a major roof section']},
{id:'right',title:'Right side overview',kind:'photo',lead:'Move to the right side and fit the full eave and gable or hip.',tip:'Show the roof slope, wall, and ground together. Take this from a different angle than the front.',checks:['Full right roof edge is visible','The slope and its relation to the wall are clear']},
{id:'back',title:'Rear overview',kind:'photo',lead:'Get the entire back elevation, including extensions or lower roofs.',tip:'Step back or use a safe public vantage point. If blocked, record that limitation in the notes at the end.',checks:['Both back corners and the roofline are visible','Additions, porches, or lower roof sections are included']},
{id:'left',title:'Left side overview',kind:'photo',lead:'Capture the opposite side to complete the perimeter.',tip:'Include enough wall to distinguish eaves from rakes and see slope changes.',checks:['Full left roof edge is visible','All visible roof planes and changes in pitch are clear']},
{id:'reference',title:'Measured reference',kind:'photo',lead:'Photograph the measured span beside the house, with its endpoints visible.',tip:'Place a rigid ruler or tape flat against the wall on the same facade, or photograph both endpoints of a laser-measured wall span. Record its exact length below. This establishes wall scale, not roof-plane area by itself.',checks:['Both reference endpoints are visible and the exact span is known','Wall corners or roof edges are also visible for context']},
{id:'details',title:'Roof details',kind:'photo',lead:'Photograph valleys, dormers, skylights, chimneys, vents, and complex intersections.',tip:'Keep enough surrounding roof in frame to locate each detail. One required context shot here; add more to your phone camera roll if needed.',checks:['At least one detail or representative roof field is sharp','Any visible obstruction or hidden plane will be noted']},
{id:'dimensions',title:'Ground dimensions',kind:'dimensions',lead:'Enter measured lengths and pitch information to support the photo set.',tip:'Use a laser meter or tape for wall lengths. Enter what you know; do not guess hidden dimensions.'},
{id:'finish',title:'Capture complete',kind:'finish',lead:'Review the set and save each picture to share for roof tracing and estimating.',tip:'A proper roof area still requires plane geometry and pitch, preferably checked against aerial imagery or a physical measurement.'}
];let index=0,photos={},checks={},values={};const screen=document.querySelector('#screen');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function field(key,label,type='text',placeholder=''){return `<label for="${key}">${label}</label><input id="${key}" type="${type}" placeholder="${placeholder}" value="${esc(values[key])}" ${type==='number'?'min="0" step="any" inputmode="decimal"':''}>`};function persistFields(){document.querySelectorAll('input:not([type=file]):not([type=checkbox]),textarea').forEach(el=>{values[el.id]=el.value})}function render(){let s=steps[index];document.querySelector('#count').textContent=index===steps.length-1?'Complete':`STEP ${index+1} OF ${steps.length-1}`;document.querySelector('#fill').style.width=`${index/(steps.length-1)*100}%`;let html=`<div class="eyebrow">${s.kind==='photo'?'Photo '+index+' · Guided capture':'Roof measurement'}</div><h1>${s.title}</h1><p>${s.lead}</p><div class="guide"><strong>How to get it</strong><span>${s.tip}</span></div>`;
if(s.kind==='setup')html+=`<div class="card">${field('address','Job address','text','Street, city')}${field('referenceType','Reference object or measured wall span','text','e.g., rigid 4 ft ruler, measured garage door')}${field('referenceLength','Reference length in feet','number','e.g., 4') }<p class="small notice">A standard object size is not a verified measurement. Measure the actual span.</p></div>`;
if(s.kind==='photo'){let pic=photos[s.id];html+=`<div class="card"><div class="shot">${pic?`<img src="${pic.url}" alt="Captured ${s.title}">`:'<div><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Photo required to continue</span></div>'}</div><div class="capture">${pic?'Retake photo':'Take photo'}<input type="file" accept="image/*" capture="environment" id="camera" aria-label="Take ${s.title} photo"></div><div id="quality" class="small ${pic?'success':''}">${pic?'Photo loaded. Check the framing below.':''}</div><div class="checks">${s.checks.map((c,j)=>`<label><input type="checkbox" data-check="${j}" ${checks[s.id]?.[j]?'checked':''} ${pic?'':'disabled'}><span>${c}</span></label>`).join('')}</div></div>`;if(s.id==='reference')html+=`<div class="card">${field('referencePhotoLength','Length shown in this photo (feet)','number','e.g., 4')}</div>`}
if(s.kind==='dimensions')html+=`<div class="card">${field('frontLength','Front wall/eave length (feet)','number','measured if possible')}${field('sideLength','Side wall length (feet)','number','measured if possible')}${field('overhang','Approximate overhang (inches)','number','optional')}${field('pitch','Roof pitch (rise per 12)','number','only if measured')}${field('notes','Obstructions, additions, inaccessible sides','text','e.g., back hidden by trees')}</div><p class="notice">At least one actual wall dimension is required before finishing. Pitch can be left unknown.</p>`;
if(s.kind==='finish')html+=`<div class="card"><div class="grid"><div><b>Address</b><br>${esc(values.address)}</div><div><b>Measured reference</b><br>${esc(values.referencePhotoLength)} ft</div><div><b>Front</b><br>${esc(values.frontLength)||'Unknown'} ft</div><div><b>Side</b><br>${esc(values.sideLength)||'Unknown'} ft</div></div><ul class="finished">${steps.filter(x=>x.kind==='photo').map(x=>`<li><img src="${photos[x.id].url}" alt=""><span>${x.title}</span><button class="secondary download" data-id="${x.id}" aria-label="Save ${x.title}">Save</button></li>`).join('')}</ul><button class="primary" id="summary">Save measurement notes</button><p class="small">Save each photo and the notes, then share them together. The photos stay on this device during this session; they are not uploaded by this app.</p></div>`;
if(index<steps.length-1)html+=`<div class="row">${index?'<button class="secondary" id="back">Back</button>':''}<button class="primary" id="next" disabled>${index===steps.length-2?'Finish capture':'Continue'}</button></div>`;html+='<div class="foot">Stay on the ground. Never place a reference or take a photo where it requires climbing or reaching a roof.</div>';screen.innerHTML=html;bind();validate()}
function validate(){let s=steps[index],ok=false;if(s.kind==='setup')ok=!!values.address?.trim()&&!!values.referenceType?.trim()&&Number(values.referenceLength)>0;if(s.kind==='photo')ok=!!photos[s.id]&&s.checks.every((_,j)=>checks[s.id]?.[j])&&(s.id!=='reference'||Number(values.referencePhotoLength)>0);if(s.kind==='dimensions')ok=Number(values.frontLength)>0||Number(values.sideLength)>0;let b=document.querySelector('#next');if(b)b.disabled=!ok}
function bind(){document.querySelectorAll('input:not([type=file]):not([type=checkbox])').forEach(el=>el.addEventListener('input',()=>{persistFields();validate()}));document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{(checks[steps[index].id]??=[])[Number(el.dataset.check)]=el.checked;validate()}));document.querySelector('#camera')?.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;let q=document.querySelector('#quality');if(!file.type.startsWith('image/')){q.textContent='Please choose a picture.';q.className='error';return}try{let url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();if(img.naturalWidth<1000||img.naturalHeight<700){URL.revokeObjectURL(url);q.textContent='Image is too small. Take a full-resolution photo.';q.className='error';return}if(photos[steps[index].id])URL.revokeObjectURL(photos[steps[index].id].url);photos[steps[index].id]={file,url};checks[steps[index].id]=[];persistFields();render()}catch{q.textContent='Could not read this photo. Try again.';q.className='error'}});document.querySelector('#next')?.addEventListener('click',()=>{persistFields();validate();if(document.querySelector('#next').disabled)return;index++;render();scrollTo(0,0)});document.querySelector('#back')?.addEventListener('click',()=>{persistFields();index--;render();scrollTo(0,0)});document.querySelectorAll('.download').forEach(b=>b.addEventListener('click',()=>download(photos[b.dataset.id].url,`${safe(values.address)}-${b.dataset.id}.${extension(photos[b.dataset.id].file)}`)));document.querySelector('#summary')?.addEventListener('click',()=>{let data={address:values.address,reference:{description:values.referenceType,lengthFeet:Number(values.referencePhotoLength)},frontLengthFeet:values.frontLength||null,sideLengthFeet:values.sideLength||null,overhangInches:values.overhang||null,pitchRisePer12:values.pitch||null,notes:values.notes||'',photos:Object.keys(photos).map(id=>`${safe(values.address)}-${id}.${extension(photos[id].file)}`)};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));download(url,`${safe(values.address)}-measurements.json`);setTimeout(()=>URL.revokeObjectURL(url),3000)})}function safe(s){return (s||'roof').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)}function extension(f){return f.type==='image/png'?'png':f.type==='image/heic'?'heic':'jpg'}function download(url,name){let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
